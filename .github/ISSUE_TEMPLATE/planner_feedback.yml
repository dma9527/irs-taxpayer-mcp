name: Planner Feedback
description: Share a planning use case, product gap, or willingness to pay without posting tax data
labels:
  - planner-feedback
body:
  - type: markdown
    attributes:
      value: |
        Do not include SSNs, tax returns, exact income, addresses, account numbers, or other taxpayer data. Describe the use case and missing capability in general terms.
  - type: dropdown
    id: use-case
    attributes:
      label: Primary use case
      options:
        - Federal tax estimate
        - Year-end planning
        - Self-employment planning
        - Credits and deductions
        - State comparison
        - Retirement planning
        - Other
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What decision were you trying to make?
      description: Use ranges or synthetic examples instead of personal tax facts.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What prevented you from completing the task?
    validations:
      required: true
  - type: dropdown
    id: paid-demand
    attributes:
      label: Would a verified local planner solve a problem you would pay for?
      options:
        - Yes
        - Maybe
        - No
    validations:
      required: true
  - type: dropdown
    id: tax-role
    attributes:
      label: Tax-domain role
      options:
        - CPA
        - Enrolled Agent
        - Tax attorney
        - Tax software professional
        - Taxpayer
        - Prefer not to say
    validations:
      required: true
  - type: checkboxes
    id: partner
    attributes:
      label: Validation partnership
      options:
        - label: I am open to discussing validation of tax rules and synthetic test cases.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include taxpayer PII or a real tax return.
          required: true
